# Workers Assets — Cloudflare paradigma novo (substitui Pages Functions).
#
# A Cloudflare unificou Workers + Pages no fluxo "Workers & Pages": projetos
# criados via "Connect to Git" sobem como Worker. Esta config faz o mesmo
# Worker servir os estáticos de `public/` e tratar `/api/lead` (form).

name = "atende-ai-landing"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Variáveis e secrets (RESEND_API_KEY, RESEND_FROM, RESEND_LEAD_TO) entram
# pelo dashboard Cloudflare → Settings → Variables and Secrets — não aqui,
# este arquivo é versionado.

[assets]
directory = "./public"
binding = "ASSETS"
# 404 customizado opcional; sem isso devolve o asset 404.html se existir.
not_found_handling = "404-page"
